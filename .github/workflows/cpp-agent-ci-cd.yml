name: C++ Autonomous Trading Agent CI

# Static analysis policy: findings that indicate a real defect (errors and warnings) block the
# pipeline. Style, performance and portability findings are advisory - they are reported and
# uploaded, never gating. Previously a single --enable=warning,style,performance,portability run
# with --error-exitcode=1 gated everything, so this job never once reached compilation.

on:
  push:
    branches: [ feat/cpp-trading-agent, main, dev ]
  pull_request:
    branches: [ feat/cpp-trading-agent, main, dev ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Static Analysis & Regression Tests (${{ matrix.compiler }})
    runs-on: ubuntu-latest

    # An isolated, disposable MySQL for the database-backed tests. Synthetic schema, restricted
    # account, no production credentials, no SSH tunnel and no live market data - the tests are
    # pointed at this by CPP_TEST_DB plus explicit values, and the suite refuses to connect
    # without them (see tests/test_db_config.hpp).
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-pw
          MYSQL_DATABASE: hermes_cpp_test
          MYSQL_USER: cpp_test_rw
          MYSQL_PASSWORD: ci-test-pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-pw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    strategy:
      # A failure on one compiler must not cancel the other: both configurations have to report.
      fail-fast: false
      matrix:
        # clang-17 is the C driver; CMAKE_CXX_COMPILER needs clang++-17. Selecting clang-17
        # made CMake treat the C driver as a C++ compiler, which compiles nothing and then
        # fails at link with "no such file or directory" from the compiler launcher.
        compiler: [ g++-13, clang++-17 ]
        build_type: [ Release ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Build Dependencies
        # The link line is: pthread mysqlclient curl ssl crypto.
        #   libmysqlclient-dev  provides mysql/mysql.h and libmysqlclient   (was libmysqlcppconn-dev,
        #                       which is a different, unused C++ connector)
        #   libssl-dev          provides openssl/*.h and libssl/libcrypto
        #   libcurl4-openssl-dev provides curl/curl.h
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential cppcheck g++-13 clang-17 \
            libssl-dev libcurl4-openssl-dev libmysqlclient-dev mysql-client

      - name: Configure CMake
        # The previous invocation also passed -DENABLE_TESTS=ON and -DENABLE_HARDENING=ON. Neither
        # option exists in CMakeLists.txt, so both were silently ignored. Hardening flags are set
        # in CMAKE_CXX_FLAGS_RELEASE, and enable_testing()/add_test() run unconditionally.
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}

      - name: Static Analysis - blocking gate (errors and warnings)
        run: |
          cppcheck --enable=warning \
            --error-exitcode=1 \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --template=gcc \
            src/

      - name: Static Analysis - advisory report (style, performance, portability)
        continue-on-error: true
        run: |
          cppcheck --enable=style,performance,portability \
            --suppress=missingIncludeSystem \
            --template=gcc \
            src/ 2>&1 | tee cppcheck-advisory.txt

      - name: Upload advisory static-analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-advisory-${{ matrix.compiler }}
          path: cppcheck-advisory.txt
          if-no-files-found: ignore

      - name: Initialise the isolated test schema
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -pci-root-pw hermes_cpp_test < tests/schema/hermes_cpp_test.sql
          echo "tables loaded:"
          mysql -h 127.0.0.1 -P 3306 -uroot -pci-root-pw -N -e \
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='hermes_cpp_test';"

      - name: Build Binary, Unit Tests and Regression Tests
        run: cmake --build build -j $(nproc)

      - name: Run Test Suites (ctest)
        env:
          # Explicit opt-in plus explicit values. The suite has no defaults, by design.
          CPP_TEST_DB: "1"
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: cpp_test_rw
          MYSQL_PASSWORD: ci-test-pw
          DATABASE_NAME: hermes_cpp_test
          # Same session semantics as the local consolidated setup: IST, session-scoped.
          MYSQL_SESSION_TIME_ZONE: "+05:30"
          TZ: Asia/Kolkata
        run: ctest --test-dir build --output-on-failure

      # The old workflow ran ./build/bin/latency_benchmark --max-p99-us 15. No such target exists
      # in CMakeLists.txt, and no binary is produced under build/bin/, so that step could only ever
      # have failed. A latency gate is worth having, but it has to be built first - it is not
      # reintroduced here as a passing-looking no-op.

      - name: Upload Binary Artifact
        if: matrix.compiler == 'g++-13'
        uses: actions/upload-artifact@v4
        with:
          # Targets emit to build/<target>; there is no build/bin/ directory.
          name: cpp-trading-agent-linux-x64
          path: build/cpp-trading-agent
          if-no-files-found: error

  # ----------------------------------------------------------------------------------------------
  # PRODUCTION DEPLOYMENT - DISABLED. Do not re-enable without an explicit authorization.
  #
  # This job was armed on any push to feat/cpp-trading-agent. It had never fired only because the
  # build-and-test job failed at static analysis first, so it would have become live the moment
  # the gate above was corrected. Three verified defects made that unsafe:
  #
  #   1. It would have copied a binary to the VM and restarted the agent from an unreviewed commit,
  #      while the fail-closed daily-loss control and the ceiling preservation were local-only.
  #   2. It restarted `cpp-trading-agent.service` over SSH with systemctl. The VM runs the agent
  #      under PM2; that unit does not exist, so the restart would have failed *after* the binary
  #      had already been overwritten - the worst ordering.
  #   3. It copied to /home/ubuntu/trading-agent/bin. The agent runs from
  #      /home/ubuntu/cpp-trading-agent.
  #
  # Deployment to the VM is done manually over SSH with a pm2 restart, and that remains the only
  # path until this job is corrected, given a scoped credential, and deliberately re-enabled.
  # ----------------------------------------------------------------------------------------------
  deploy-to-oracle-vm:
    name: Deploy to Oracle Cloud VM (DISABLED)
    needs: build-and-test
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Deployment disabled
        run: |
          echo "Production deployment is disabled pending the corrections documented in this workflow."
